name: alphalens-api
version: 2.1.0
author: walidmustapha
description: Use this skill whenever the user wants to research companies, map competitive landscapes, analyze investor networks, benchmark peer companies, or find market white space using the AlphaLens platform. Triggers on: any explicit mention of 'AlphaLens'; requests like 'market map', 'competitive landscape', 'find companies like X', 'similar companies to', 'investor network', 'who funds these companies', 'peer benchmark', 'compare these companies by headcount or funding', 'white space', 'blue ocean analysis', 'uncontested positioning', 'find market gaps'; or bottom-up deep dives on a specific company. Also triggers on 'AlphaLens pipeline', 'AlphaLens enrichment', 'add to AlphaLens pipeline', and 'AlphaLens target list'. Do NOT fire on generic mentions of 'pipeline' or 'enrich' without an AlphaLens context marker.
license: MIT-0

config:
  ALPHALENS_API_KEY:
    type: string
    required: true
    description: "API key for AlphaLens"
    secret: true

metadata:
  openclaw:
    requires:
      env: ["ALPHALENS_API_KEY"]
    primaryEnv: ALPHALENS_API_KEY
    homepage: https://alphalens.ai